name: Setup Python
description: |
  Consistently installs python across this project. Should be used as a
  replacement for direct calls to actions/setup-python.

  Serves as the single place to update python versions over time across the
  project.
outputs:
  python-version:
    description: Version of Python installed
    value: ${{ steps.setup-python.outputs.python-version }}
runs:
  using: composite
  steps:
  - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    with:
      version: "0.13.7"
      # enable-cache left at its default of "auto", which disables the cache
      # on pull_request_target, workflow_run, releases and tag pushes.
      # Several workflows check out fork content under pull_request_target
      # (behave.yml runs PR-supplied step code) and a cache saved there lands
      # in the base-branch scope every other workflow restores from.
      cache-dependency-glob: "scripts/uv.lock"
  - shell: bash
    id: setup-python
    env:
      # Single source of truth for the project's Python version.
      PYTHON_VERSION: "3.10"
    run: |
      uv python install "${PYTHON_VERSION}"
      # Pin every later uv call in the job. .python-version is gitignored, so
      # uv would otherwise pick any interpreter satisfying requires-python.
      echo "UV_PYTHON=${PYTHON_VERSION}" >> "$GITHUB_ENV"
      echo "python-version=${PYTHON_VERSION}" >> "$GITHUB_OUTPUT"
