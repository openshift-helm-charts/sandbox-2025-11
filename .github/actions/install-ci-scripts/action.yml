name: Install our CI scripts
description: |
  Handles installation and caching/restore of the CI scripts in a virtualenv.
inputs:
  working-directory:
    description: Basedir in which to save / restore cache and install venv.
    default: './'
    required: false
  python-version:
    description: Installed Python version
    required: true
runs:
  using: composite
  steps:
  - name: Setup venv
    shell: bash
    working-directory: ${{ inputs.working-directory }}
    env:
      # Build the venv where every existing workflow already looks for it, so
      # the `ve1/bin/<command>` call sites need no change. Absolute, because
      # uv would otherwise resolve it relative to scripts/.
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/${{ inputs.working-directory }}/ve1
      # Honour the version setup-python reported rather than letting uv pick
      # any interpreter satisfying requires-python.
      UV_PYTHON: ${{ inputs.python-version }}
    run: |
      cd scripts
      make install
